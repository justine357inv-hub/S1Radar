name: Build S1Radar Windows x86

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore S1Radar.csproj

      - name: Publish S1Radar
        run: >
          dotnet publish S1Radar.csproj
          -c Release
          -r win-x86
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -o publish

      - name: Package S1Radar
        shell: pwsh
        run: |
          Compress-Archive `
            -Path publish\* `
            -DestinationPath S1Radar-Windows-x86.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: S1Radar-Windows-x86
          path: S1Radar-Windows-x86.zip
